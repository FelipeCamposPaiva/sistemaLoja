spring.config.import=optional:file:./config/local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/temdetudo_db?useSSL=false&serverTimezone=America/Sao_Paulo

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.port=8080
server.tomcat.max-http-post-size=20MB
server.tomcat.max-swallow-size=20MB
server.servlet.session.persistent=false

#spring.jackson.serialization.write-dates-as-timestamps=false

spring.jackson.datatype.datetime.write-dates-as-timestamps=false

#=========================================
# JWT
#=========================================

jwt.secret=${JWT_SECRET}

jwt.expiration=86400000

erp.empresa.uf=RJ

erp.uploads.dir=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

#=========================================
# Z-API (WhatsApp via QR)
# Crie a instância em https://developer.z-api.io
# ou cole Instance / Token / Client-Token no CRM.
# Webhook (mensagens recebidas): https://SEU-DOMINIO/api/whatsapp/webhook
# Em localhost use um túnel (ngrok, Cloudflare Tunnel).
#=========================================
zapi.base-url=https://api.z-api.io
zapi.instance-id=${ZAPI_INSTANCE_ID:}
zapi.token=${ZAPI_TOKEN:}
zapi.client-token=${ZAPI_CLIENT_TOKEN:}

#=========================================
# OpenAI / ChatGPT (mesma conta de platform.openai.com)
# Chave: https://platform.openai.com/api-keys
# Também dá para colar em Integrações → ChatGPT.
#=========================================
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}