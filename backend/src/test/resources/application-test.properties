# Perfil de teste: mesmo MySQL de lab (não H2).
# Senha e JWT vêm de backend/config/local.properties, com o processo rodando em backend/.
spring.config.import=optional:file:./config/local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/temdetudo_db?useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.servlet.session.persistent=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
